name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm -r --if-present types:check
      - run: pnpm test
      - run: pnpm -r --if-present test
      # Regenerates every platform folder in memory, runs the validators and
      # fails when a committed file differs from what the build writes.
      - run: pnpm build --check
      - name: No symlinks in the repo
        run: test -z "$(git ls-files -s | awk '$1 == "120000"')"

  claude:
    runs-on: ubuntu-latest
    env:
      CLAUDE: npx -y @anthropic-ai/claude-code@2.1.309
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the Claude plugin and marketplace
        run: |
          $CLAUDE plugin validate ./plugins/claude/rushdb
          $CLAUDE plugin validate .
      # Fails on PRIVACY_URL_MISSING until the owner sets the privacy policy URL
      # (plan decision D6); make it blocking then.
      - name: Validate against the Claude directory profile
        continue-on-error: true
        run: $CLAUDE plugin validate --strict --profile directory ./plugins/claude/rushdb

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary from its official image; the GitHub Action needs a
      # paid license for organization repositories.
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact --verbose
