name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm -r --if-present types:check
      - run: pnpm test
      - run: pnpm -r --if-present test
      # Regenerates every platform folder in memory, runs the validators and
      # fails when a committed file differs from what the build writes.
      - run: pnpm build --check
      - name: Gemini CLI validates the root extension
        run: npx -y @google/gemini-cli@0.68.0 extensions validate .
      # The installer has no version pin; it always fetches the latest agy.
      - name: Install the Antigravity CLI
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir "$RUNNER_TEMP/agy"
      - name: agy validates the root plugin (known Gemini-root warnings only)
        run: pnpm check:antigravity
        env:
          AGY_BIN: ${{ runner.temp }}/agy/agy
      - name: No GitHub Release breaks Gemini installs
        run: pnpm check:releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: No symlinks in the repo
        run: test -z "$(git ls-files -s | awk '$1 == "120000"')"

  claude:
    runs-on: ubuntu-latest
    env:
      CLAUDE: npx -y @anthropic-ai/claude-code@2.1.309
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the Claude plugin and marketplace
        run: |
          $CLAUDE plugin validate ./plugins/claude/rushdb
          $CLAUDE plugin validate .
      # Fails on PRIVACY_URL_MISSING until the owner sets the privacy policy URL
      # (plan decision D6); make it blocking then.
      - name: Validate against the Claude directory profile
        continue-on-error: true
        run: $CLAUDE plugin validate --strict --profile directory ./plugins/claude/rushdb

  dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packs @rushdb/dsh and installs it into a scratch DSH_HOME with a pinned dsh: plugin add, --dump-config,
      # --dump-config-schema, and headless boots that check automatic context off (no requests, no files) and on.
      - name: dsh installs and loads @rushdb/dsh
        run: pnpm --filter @rushdb/dsh smoke

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Relative links and anchors in the hand-written docs. Offline, so links to
      # pages that go live later (this repository, the listings) don't fail it.
      - name: Check links in the docs
        run: >-
          docker run --rm -v "$PWD:/input" -w /input lycheeverse/lychee:0.24.2
          --offline --include-fragments --no-progress
          README.md CONTRIBUTING.md SECURITY.md '.changeset/*.md' 'shared/*.md' 'submissions/*.md'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary from its official image; the GitHub Action needs a
      # paid license for organization repositories.
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact --verbose
