name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm -r --if-present types:check
      - run: pnpm test
      - run: pnpm -r --if-present test
      # Regenerates every platform folder in memory, runs the validators and
      # fails when a committed file differs from what the build writes.
      - run: pnpm build --check
      - name: No symlinks in the repo
        run: test -z "$(git ls-files -s | awk '$1 == "120000"')"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Relative links and anchors in the hand-written docs. Offline, so links to
      # pages that go live later (this repository, the listings) don't fail it.
      - name: Check links in the docs
        run: >-
          docker run --rm -v "$PWD:/input" -w /input lycheeverse/lychee:0.24.2
          --offline --include-fragments --no-progress
          README.md CONTRIBUTING.md SECURITY.md '.changeset/*.md' 'shared/*.md' 'submissions/*.md'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary from its official image; the GitHub Action needs a
      # paid license for organization repositories.
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact --verbose
